name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Check the server imports and registers its tools
        run: |
          python - <<'PY'
          import asyncio, server
          names = sorted(t.name for t in asyncio.run(server.mcp.list_tools()))
          expected = [
              "edgar_get_filings", "edgar_search_company",
              "fred_get_series", "fred_search_series",
              "market_get_overview", "market_get_quote",
          ]
          assert names == expected, f"tool registry drifted: {names}"
          print(f"registered {len(names)} tools:", ", ".join(names))
          PY
